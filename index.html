<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>說故事比賽 - Storytelling Competition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px 20px 190px 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        header {
            text-align: center; padding: 30px 20px;
            background: white; border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 16px;
        }
        header h1 { color: #2c3e50; font-size: 2rem; font-weight: 700; margin-bottom: 8px; }
        header p { color: #7f8c8d; font-size: 1rem; }

        /* 工具列：顯示模式 + 匯出 PDF */
        .toolbar {
            display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
            background: white; border-radius: 14px; padding: 12px 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 12px;
        }
        .seg { display: flex; background: #f0f2f5; border-radius: 10px; padding: 4px; gap: 4px; }
        .seg-btn {
            border: none; background: transparent; cursor: pointer;
            padding: 8px 18px; border-radius: 8px;
            font-size: 0.95rem; font-weight: 600; color: #5d6d7e;
            transition: all 0.2s;
        }
        .seg-btn.active {
            background: linear-gradient(135deg, #4facfe 0%, #00c6ff 100%);
            color: white; box-shadow: 0 2px 8px rgba(79,172,254,0.4);
        }
        .export-group { display: flex; gap: 8px; flex-wrap: wrap; margin-left: auto; }

        /* 分頁籤 */
        .tabs {
            position: sticky; top: 10px; z-index: 50;
            display: flex; gap: 8px; overflow-x: auto;
            padding: 10px; margin-bottom: 16px;
            background: rgba(255,255,255,0.95);
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            backdrop-filter: blur(6px);
        }
        .tab {
            flex: 0 0 auto; padding: 10px 16px;
            border: 2px solid transparent; border-radius: 10px;
            background: #f0f2f5; color: #2c3e50;
            font-size: 0.95rem; font-weight: 600; cursor: pointer;
            transition: all 0.2s; white-space: nowrap;
        }
        .tab:hover { background: #e4e8eb; }
        .tab.active {
            background: linear-gradient(135deg, #4facfe 0%, #00c6ff 100%);
            color: white; border-color: #4facfe;
            box-shadow: 0 4px 12px rgba(79,172,254,0.4);
        }
        .tab .tab-sub { display: block; font-size: 0.75rem; font-weight: 400; opacity: 0.85; }

        .story-card {
            background: white; border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 24px;
        }
        .story-header {
            display: flex; align-items: center; gap: 16px;
            margin-bottom: 16px; padding-bottom: 14px;
            border-bottom: 2px solid #f0f2f5;
        }
        .student-avatar {
            width: 56px; height: 56px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; font-weight: 700; color: white; flex-shrink: 0;
        }
        .student-avatar.female { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .student-avatar.male { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .student-info h3 { font-size: 1.2rem; color: #2c3e50; font-weight: 600; }
        .student-info span { font-size: 0.85rem; color: #95a5a6; }
        .story-title { font-size: 1.3rem; font-weight: 600; color: #34495e; margin-bottom: 12px; }
        .hint { font-size: 0.85rem; color: #95a5a6; margin-bottom: 12px; }
        .story-text { line-height: 1.9; font-size: 1.08rem; color: #2c3e50; }
        .sentence {
            display: block; padding: 8px 12px; border-radius: 8px;
            transition: all 0.2s ease; cursor: pointer; margin: 4px 0;
        }
        .sentence:hover { background: #f8f9fa; }
        .sentence.playing {
            background: linear-gradient(90deg, #e8f4fd 0%, #d6eaff 100%);
            border-left: 4px solid #4facfe;
        }
        .sentence.spoken { color: #95a5a6; }
        .sentence .en { display: block; }
        .sentence .zh {
            display: block; font-size: 0.95rem; color: #7f8c8d;
            margin-top: 4px; line-height: 1.7;
        }
        .sentence.spoken .zh { color: #bdc3c7; }

        /* 錄音跟讀 */
        .rec-btn {
            display: inline-flex; align-items: center; gap: 4px;
            margin-top: 6px; padding: 5px 12px; border: none; border-radius: 20px;
            background: #eef1f4; color: #5d6d7e;
            font-size: 0.82rem; font-weight: 600; cursor: pointer;
            transition: all 0.2s;
        }
        .rec-btn:hover { background: #e0e6eb; }
        .rec-btn.recording {
            background: #ff5b5b; color: white;
            animation: recpulse 1s infinite;
        }
        .rec-btn:disabled { opacity: 0.6; cursor: wait; }
        @keyframes recpulse {
            0% { box-shadow: 0 0 0 0 rgba(255,91,91,0.5); }
            70% { box-shadow: 0 0 0 8px rgba(255,91,91,0); }
            100% { box-shadow: 0 0 0 0 rgba(255,91,91,0); }
        }
        .rec-feedback {
            margin-top: 8px; padding: 12px; border-radius: 10px;
            background: #f8fafc; border: 1px solid #e4e8eb;
            font-size: 0.92rem; cursor: default;
        }
        .rec-score { font-size: 1.1rem; font-weight: 700; margin-bottom: 6px; }
        .rec-score.good { color: #27ae60; }
        .rec-score.ok { color: #e67e22; }
        .rec-score.low { color: #e74c3c; }
        .rec-heard { color: #5d6d7e; margin-bottom: 6px; }
        .rec-words { line-height: 2; margin-bottom: 8px; }
        .rec-words .w-ok { background: #d4f5dd; color: #1e7e34; border-radius: 4px; padding: 2px 4px; }
        .rec-words .w-miss { background: #ffd9d9; color: #c0392b; border-radius: 4px; padding: 2px 4px; }
        .rec-words .w-skip { color: #95a5a6; padding: 2px 4px; }
        .rec-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .rec-actions audio { height: 32px; max-width: 220px; }
        .rec-tip { font-size: 0.82rem; color: #95a5a6; margin-top: 6px; }

        /* 底部常駐播放列 */
        .player-bar {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 100;
            background: rgba(255,255,255,0.98);
            border-top: 1px solid #e4e8eb;
            box-shadow: 0 -6px 24px rgba(0,0,0,0.12);
            backdrop-filter: blur(8px);
        }
        .player-inner { max-width: 900px; margin: 0 auto; padding: 12px 16px 14px 16px; }
        .player-info {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.85rem; color: #5d6d7e; margin-bottom: 8px; gap: 8px;
        }
        .player-info strong { color: #2c3e50; }
        .player-progress {
            height: 8px; background: #eef1f4; border-radius: 4px;
            overflow: hidden; margin-bottom: 10px;
        }
        .player-progress-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            border-radius: 4px; transition: width 0.15s linear;
        }
        .player-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .btn {
            padding: 10px 18px; border: none; border-radius: 10px;
            font-size: 0.95rem; font-weight: 600; cursor: pointer;
            transition: all 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .btn-primary { background: linear-gradient(135deg, #4facfe 0%, #00c6ff 100%); color: white; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(79,172,254,0.4); }
        .btn-secondary { background: #f0f2f5; color: #2c3e50; }
        .btn-secondary:hover { background: #e4e8eb; }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-sm { padding: 8px 14px; font-size: 0.88rem; }
        .speed-control { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: #7f8c8d; margin-left: auto; }
        .speed-control input { width: 110px; accent-color: #4facfe; }

        .voice-status {
            text-align: center; padding: 12px; background: #fff3cd;
            border-radius: 10px; color: #856404; font-size: 0.9rem;
            margin-bottom: 16px; display: none;
        }
        .voice-status.show { display: block; }
        footer { text-align: center; padding: 20px; color: #95a5a6; font-size: 0.85rem; }

        /* 列印專用（螢幕上隱藏，列印時只顯示稿件） */
        .print-area { display: none; }
        @media print {
            body { background: #fff; padding: 0; }
            .container, .player-bar { display: none !important; }
            .print-area { display: block !important; color: #000; }
            .sheet h1 { font-size: 20pt; margin-bottom: 6px; }
            .sheet .meta { font-size: 11pt; color: #333; margin-bottom: 14px; }
            .sheet ol.script { margin-left: 22px; }
            .sheet ol.script li { margin-bottom: 10px; }
            .sheet .p-en { font-size: 12pt; line-height: 1.6; }
            .sheet .p-zh { font-size: 11pt; line-height: 1.6; color: #333; margin-top: 2px; }
            .sheet .foot { margin-top: 18px; font-size: 9pt; color: #666; border-top: 1px solid #999; padding-top: 6px; }
        }
        @page { margin: 18mm 15mm; }

        @media (max-width: 600px) {
            header h1 { font-size: 1.5rem; }
            .story-card { padding: 16px; }
            .export-group { margin-left: 0; }
            .speed-control { margin-left: 0; width: 100%; }
            body { padding: 12px 12px 210px 12px; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>說故事比賽作品集</h1>
            <p>Storytelling Competition Collection · 點分頁切換學生 · 點句子可從該句播放</p>
        </header>

        <div id="voiceStatus" class="voice-status">正在載入語音引擎... 請稍候</div>

        <div class="toolbar">
            <div class="seg" role="group" aria-label="顯示模式">
                <button id="modeEn" class="seg-btn active" onclick="setViewMode('en')">純英文</button>
                <button id="modeBi" class="seg-btn" onclick="setViewMode('bi')">中英對照</button>
            </div>
            <div class="export-group">
                <button class="btn btn-secondary btn-sm" onclick="exportPDF('en')">匯出純英文朗讀稿 PDF</button>
                <button class="btn btn-secondary btn-sm" onclick="exportPDF('bi')">匯出中英對照朗讀稿 PDF</button>
            </div>
        </div>

        <nav class="tabs" id="tabs" aria-label="學生分頁"></nav>

        <div id="storyWrap"></div>

        <footer>
            <p>使用瀏覽器內建語音合成 (Web Speech API) | 適合練習聽力與跟讀</p>
        </footer>
    </div>

    <!-- 常駐播放列：永遠在畫面底部，隨時可暫停 / 重新播放 -->
    <div class="player-bar">
        <div class="player-inner">
            <div class="player-info">
                <span id="playerTitle">尚未播放</span>
                <span id="playerCount">第 0 / 0 句</span>
            </div>
            <div class="player-progress" title="播放進度">
                <div class="player-progress-fill" id="playerProgressFill"></div>
            </div>
            <div class="player-controls">
                <button class="btn btn-primary" id="btnPlay">▶ 播放全文</button>
                <button class="btn btn-secondary" id="btnPause" disabled>⏸ 暫停</button>
                <button class="btn btn-secondary" id="btnReplay">↺ 重新播放</button>
                <button class="btn btn-secondary" id="btnStop" disabled>⏹ 停止</button>
                <div class="speed-control">
                    <span>語速</span>
                    <input type="range" id="speedRange" min="0.5" max="1.5" step="0.1" value="0.7">
                    <span id="speedVal">0.7x</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 列印用稿件區 -->
    <div class="print-area" id="printArea"></div>

    <script>
        // 每位學生的稿件：逐句中英對照（朗讀只唸英文）
        const students = [
            {
                id: '60124',
                name: '何禹潼',
                gender: 'female',
                title: 'The Sound of Silence',
                lines: [
                    { en: `In the Kingdom of Chords, mistakes made noise.`, zh: `在和弦王國裡，犯錯是會發出聲響的。` },
                    { en: `Whenever someone did something wrong, a sharp, broken musical note would loop around them forever.`, zh: `每當有人做錯事，一個尖銳破碎的音符就會永遠纏繞著他。` },
                    { en: `Kiran lived with the loudest noise in the kingdom.`, zh: `奇蘭背負著全王國最響亮的噪音。` },
                    { en: `A deafening screech of broken strings followed his every step.`, zh: `震耳欲聾的斷弦尖嘯，如影隨形地跟著他的每一步。` },
                    { en: `It came from a past betrayal that ruined his best friendship.`, zh: `那是因為過去的一次背叛，毀掉了他最好的友誼。` },
                    { en: `The noise was constant, and he was exhausted.`, zh: `噪音從未停歇，他已心力交瘁。` },
                    { en: `Kiran climbed the Whispering Ravine, searching for quiet.`, zh: `奇蘭攀爬低語深谷，尋找安靜。` },
                    { en: `First: A Weaver offered him thick earmuffs. "Block the sound," she said.`, zh: `首先，一位織布工送他一副厚耳罩。「把聲音擋掉吧，」她說。` },
                    { en: `Kiran refused. "Muffling the noise does not stop it from playing."`, zh: `奇蘭拒絕了。「悶住噪音，並不能讓它停止播放。」` },
                    { en: `Second: A Musician offered to play loud, happy music over it. "Drown it out," he said.`, zh: `接著，一位音樂家提議用響亮歡快的音樂蓋過它。「把它淹沒掉，」他說。` },
                    { en: `Kiran shook his head. "Adding more noise only makes more chaos."`, zh: `奇蘭搖搖頭。「增加更多噪音，只會製造更多混亂。」` },
                    { en: `Third: A Critic offered to analyze the sound wave. "Understand it, and it won't hurt," he said.`, zh: `第三位，一位評論家提議分析這道音波。「理解它，它就不會傷到你，」他說。` },
                    { en: `Kiran declined. "Analyzing the noise does not bring peace."`, zh: `奇蘭婉拒了。「分析噪音，並不能帶來平靜。」` },
                    { en: `Kiran reached the very top of the ravine.`, zh: `奇蘭登上了深谷的最頂端。` },
                    { en: `The air here was dead silent, making his inner noise feel ten times louder.`, zh: `這裡的空氣一片死寂，讓他內心的噪音感覺大了十倍。` },
                    { en: `His head throbbed. He stopped fighting.`, zh: `他的頭隱隱作痛。他不再抵抗了。` },
                    { en: `He uncovered his ears, closed his eyes, and finally just listened to the terrible sound.`, zh: `他拿下遮住耳朵的手，閉上眼睛，終於靜靜聆聽那可怕的聲音。` },
                    { en: `He accepted the pain of what he had done, and whispered: "I built this screeching cage with my own choices... but I'm finally brave enough to stop running and set us free."`, zh: `他接受了自己所作所為帶來的痛，輕聲說：「這座尖嘯的牢籠是我自己的選擇造成的……但我終於有勇氣不再逃跑，讓我們都自由。」` },
                    { en: `Instantly, the screeching notes changed.`, zh: `就在那一瞬間，尖嘯的音符改變了。` },
                    { en: `They softened into a gentle harmony, then faded into total silence.`, zh: `它們漸漸化為柔和的和聲，然後消散成一片寂靜。` },
                    { en: `Kiran opened his eyes to a quiet world.`, zh: `奇蘭睜開眼睛，世界一片安靜。` },
                    { en: `He realized the loudest noises are not the mistakes we make, but the excuses we use to run away from them.`, zh: `他明白了：最響亮的噪音不是我們犯的錯，而是我們用來逃避的藉口。` }
                ]
            },
            {
                id: '60120',
                name: '蔡亞璇',
                gender: 'female',
                title: 'The Boy and the Apple Tree',
                lines: [
                    { en: `Once upon a time, a little boy loved a big apple tree.`, zh: `從前從前，有一個小男孩深愛著一棵大蘋果樹。` },
                    { en: `Every day, he played under the tree, climbed its branches, and ate sweet apples.`, zh: `每天，他都在樹下玩耍，爬上樹枝，吃著香甜的蘋果。` },
                    { en: `The tree loved the boy, and they were very happy.`, zh: `大樹愛著小男孩，他們非常快樂。` },
                    { en: `As time went by, the boy grew up and stopped visiting.`, zh: `時光流逝，小男孩長大了，不再來探望大樹。` },
                    { en: `One day, he returned looking sad.`, zh: `有一天，他帶著難過的表情回來了。` },
                    { en: `"I want toys, but I have no money," he said.`, zh: `「我想要玩具，可是我沒有錢，」他說。` },
                    { en: `The tree smiled and said, "Take my apples and sell them in town."`, zh: `大樹微笑著說：「把我的蘋果帶去鎮上賣掉吧。」` },
                    { en: `The boy picked all the apples and ran away happily.`, zh: `小男孩摘下所有的蘋果，開開心心地跑走了。` },
                    { en: `Many years passed.`, zh: `許多年過去了。` },
                    { en: `The boy did not return, and the tree felt very lonely.`, zh: `小男孩沒有再回來，大樹感到非常孤單。` }
                ]
            },
            {
                id: '60122',
                name: '陳柏舜',
                gender: 'male',
                title: 'Leo and the Time Radio',
                lines: [
                    { en: `Leo found the radio at the back of his grandfather's dusty garage.`, zh: `李歐在他爺爺佈滿灰塵的車庫深處發現了一台收音機。` },
                    { en: `It wasn't anything sleek or modern; it was a bulky, wooden box with a glowing amber dial and brass knobs that felt heavy and cold to the touch.`, zh: `它一點也不流線現代，而是一個笨重的木盒子，有著發出琥珀色光芒的刻度盤，和摸起來又重又冰涼的黃銅旋鈕。` },
                    { en: `He only plugged it in to see if the ancient tubes still worked.`, zh: `他插上插頭，只是想看看古老的真空管還能不能用。` },
                    { en: `They did, humming to life with a soft, warm light, but the speaker only offered a steady wall of static.`, zh: `真空管竟然亮了，發出柔和溫暖的光和嗡嗡聲，但喇叭只傳出持續不斷的雜音。` },
                    { en: `He turned the largest knob, listening to the hiss and crackle, until suddenly, a voice cut through the noise.`, zh: `他轉動最大的旋鈕，聽著嘶嘶雜音，直到突然有個聲音切入噪音之中。` },
                    { en: `It wasn't a local DJ or a familiar news anchor.`, zh: `那不是本地電台主持人，也不是熟悉的主播。` },
                    { en: `The voice sounded incredibly clear, speaking in a calm, almost mechanical rhythm.`, zh: `那聲音異常清晰，用平靜近乎機械的節奏說話。` },
                    { en: `"Attention citizens of Sector Four. Tomorrow's solar transit will cause minor disruptions to all aerial tram schedules. Please plan for a ten-minute delay.`, zh: `「第四區市民請注意。明天的太陽凌日將造成空中纜車班次小幅延誤，請預留十分鐘。` },
                    { en: `Also, remember to calibrate your UV-reflective gear; the atmospheric glare will be particularly intense this week."`, zh: `另外，請記得校準你們的抗紫外線裝備，本週的大氣眩光會特別強烈。」` },
                    { en: `Leo froze, his hand hovering over the dial.`, zh: `李歐僵住了，手懸在刻度盤上。` },
                    { en: `Aerial trams? Sector Four?`, zh: `空中纜車？第四區？` },
                    { en: `He carefully twisted the knob a fraction of an inch, hoping to catch more, but the station vanished, swallowed instantly back into the white noise.`, zh: `他小心翼翼地把旋鈕轉動一點點，想再多聽一點，但那個電台消失了，瞬間被雜音吞沒。` },
                    { en: `Over the next few weeks, Leo became completely absorbed by the device.`, zh: `接下來的幾個星期，李歐完全沉迷於這台機器。` },
                    { en: `He spent every afternoon in the sweltering garage, meticulously adjusting the brass dials.`, zh: `每天下午，他都待在悶熱的車庫裡，仔細調整黃銅旋鈕。` },
                    { en: `He quickly learned that the radio didn't tune into different geographical stations; it tuned into different eras.`, zh: `他很快發現，這台收音機調的不是不同地區的電台，而是不同的時代。` },
                    { en: `On a rainy Tuesday, he heard a broadcast from what sounded like a deep-sea colony, the announcer complaining about saltwater corrosion on the exterior domes.`, zh: `在一個下雨的星期二，他聽到疑似來自深海殖民地的廣播，主播抱怨外部穹頂的鹽水腐蝕。` },

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        class TTSManager {
            constructor() {
                this.synth = window.speechSynthesis;
                this.voices = [];
                this.currentUtterance = null;
                this.currentStudent = null;
                this.currentSentenceIndex = 0;
                this.sentences = [];
                this.isPlaying = false;
                this.isPaused = false;
                this.speed = 0.7;
                this.onSentenceChange = null;
                this.onEnd = null;
                this.session = 0;
                this.loadVoices();
            }
            loadVoices() {
                this.voices = this.synth.getVoices();
                if (this.voices.length === 0) {
                    this.synth.onvoiceschanged = () => this.loadVoices();
                }
                this.updateVoiceStatus();
            }
            updateVoiceStatus() {
                const statusEl = document.getElementById('voiceStatus');
                if (this.voices.length === 0) {
                    statusEl.textContent = '語音引擎載入中... 請稍候';
                    statusEl.classList.add('show');
                } else {
                    statusEl.classList.remove('show');
                }
            }
            getVoice(gender) {
                const prefs = gender === 'female'
                    ? ['Microsoft Zira', 'Microsoft Huihui', 'Google US English Female', 'Google UK English Female', 'Samantha', 'Karen', 'Veena']
                    : ['Microsoft David', 'Microsoft Kangkang', 'Google US English Male', 'Google UK English Male', 'Alex', 'Daniel', 'Ravi'];
                for (const pref of prefs) {
                    const voice = this.voices.find(v => v.name.includes(pref));
                    if (voice) return voice;
                }
                const keyword = gender === 'female' ? 'female' : 'male';
                const voice = this.voices.find(v => v.name.toLowerCase().includes(keyword));
                if (voice) return voice;
                return this.voices[0] || null;
            }
            speak(student, sentences, startIndex = 0) {
                this.stop(true);
                this.currentStudent = student;
                this.sentences = sentences;
                this.currentSentenceIndex = startIndex;
                this.isPlaying = true;
                this.isPaused = false;
                this.speakNext();
            }
            speakNext() {
                const mySession = this.session;
                if (this.currentSentenceIndex >= this.sentences.length) {
                    const cb = this.onEnd;
                    this.isPlaying = false;
                    this.isPaused = false;
                    if (cb) cb();
                    return;
                }
                const myIndex = this.currentSentenceIndex;
                const sentence = this.sentences[myIndex].trim();
                if (!sentence) {
                    this.currentSentenceIndex++;
                    this.speakNext();
                    return;
                }
                this.currentUtterance = new SpeechSynthesisUtterance(sentence);
                this.currentUtterance.lang = 'en-US';
                this.currentUtterance.rate = this.speed;
                this.currentUtterance.pitch = 1;
                this.currentUtterance.volume = 1;
                const voice = this.getVoice(this.currentStudent.gender);
                if (voice) this.currentUtterance.voice = voice;
                this.currentUtterance.onstart = () => {
                    if (mySession !== this.session) return;
                    if (this.onSentenceChange) this.onSentenceChange(myIndex, 'playing');
                };
                this.currentUtterance.onend = () => {
                    if (mySession !== this.session) return;
                    if (this.onSentenceChange) this.onSentenceChange(myIndex, 'spoken');
                    if (this.currentSentenceIndex === myIndex) this.currentSentenceIndex++;
                    if (this.isPlaying && !this.isPaused) this.speakNext();
                };
                this.currentUtterance.onerror = (e) => {
                    if (mySession !== this.session) return;
                    if (e && (e.error === 'canceled' || e.error === 'interrupted')) return;
                    if (this.currentSentenceIndex === myIndex) this.currentSentenceIndex++;
                    if (this.isPlaying) this.speakNext();
                };
                this.synth.speak(this.currentUtterance);
            }
            pauseToggle() {
                if (!this.isPlaying) return false;
                if (this.isPaused) {
                    this.synth.resume();
                    this.isPaused = false;
                } else {
                    this.synth.pause();
                    this.isPaused = true;
                }
                return this.isPaused;
            }
            stop(silent) {
                this.session++;
                this.isPlaying = false;
                this.isPaused = false;
                this.synth.cancel();
                this.currentUtterance = null;
                if (!silent && this.onSentenceChange) this.onSentenceChange(this.currentSentenceIndex, 'reset');
            }
            setSpeed(speed) {
                this.speed = speed;
            }
        }

        const tts = new TTSManager();
        let activeStudentId = students[0].id;
        let activeSentences = [];
        let viewMode = 'en'; // 'en' 純英文，'bi' 中英對照

        const tabsEl = document.getElementById('tabs');
        const storyWrap = document.getElementById('storyWrap');
        const btnPlay = document.getElementById('btnPlay');
        const btnPause = document.getElementById('btnPause');
        const btnReplay = document.getElementById('btnReplay');
        const btnStop = document.getElementById('btnStop');
        const playerTitle = document.getElementById('playerTitle');
        const playerCount = document.getElementById('playerCount');
        const playerProgressFill = document.getElementById('playerProgressFill');
        const speedRange = document.getElementById('speedRange');
        const speedVal = document.getElementById('speedVal');
        const modeEnBtn = document.getElementById('modeEn');
        const modeBiBtn = document.getElementById('modeBi');

        function activeStudent() {
            return students.find(s => s.id === activeStudentId);
        }

        function renderTabs() {
            tabsEl.innerHTML = students.map(s =>
                `<button class="tab ${s.id === activeStudentId ? 'active' : ''}" onclick="switchTab('${s.id}')">` +
                `${escapeHtml(s.name)}<span class="tab-sub">${escapeHtml(s.title)}</span></button>`
            ).join('');
        }

        function renderActiveStory() {
            const student = activeStudent();
            activeSentences = student.lines.map(l => l.en);
            const sentenceHtml = student.lines.map((l, i) =>
                `<div class="sentence" data-index="${i}" onclick="playFromSentence(${i})">` +
                `<span class="en">${escapeHtml(l.en)}</span>` +
                (viewMode === 'bi' ? `<span class="zh">${escapeHtml(l.zh)}</span>` : '') +
                `<br><button class="rec-btn" id="rec-btn-${i}" onclick="event.stopPropagation(); toggleRecord(${i})">錄音跟讀</button>` +
                `<div class="rec-feedback" id="rec-fb-${i}" hidden onclick="event.stopPropagation()"></div>` +
                `</div>`
            ).join('');
            storyWrap.innerHTML =
                `<article class="story-card" id="story-${student.id}">` +
                    `<div class="story-header">` +
                        `<div class="student-avatar ${student.gender}">${escapeHtml(student.name.charAt(0))}</div>` +
                        `<div class="student-info"><h3>${escapeHtml(student.name)} (${escapeHtml(student.id)})</h3>` +
                        `<span>${student.gender === 'female' ? '女生 · 女聲' : '男生 · 男聲'} · 共 ${student.lines.length} 句</span></div>` +
                    `</div>` +
                    `<h2 class="story-title">${escapeHtml(student.title)}</h2>` +
                    `<p class="hint">提示：點任一句可從該句開始朗讀；每句後的「錄音跟讀」可錄下你的聲音並由電腦評分（建議使用電腦版 Chrome / Edge＋麥克風）。</p>` +
                    `<div class="story-text">${sentenceHtml}</div>` +
                `</article>`;
            resetPlayerUI();
        }

        function switchTab(studentId) {
            if (studentId === activeStudentId && activeSentences.length > 0) return;
            stopRecording(true);
            tts.stop(true);
            activeStudentId = studentId;
            renderTabs();
            renderActiveStory();
        }

        function setViewMode(mode) {
            if (mode === viewMode) return;
            viewMode = mode;
            modeEnBtn.classList.toggle('active', mode === 'en');
            modeBiBtn.classList.toggle('active', mode === 'bi');
            stopRecording(true);
            const wasPlaying = tts.isPlaying;
            const idx = tts.currentSentenceIndex;
            renderActiveStory();
            if (wasPlaying) {
                // 句序不變，直接恢復亮點與進度，不中斷朗讀
                tts.onSentenceChange = updateSentenceUI;
                tts.onEnd = onPlayEnd;
                updateSentenceUI(Math.min(idx, activeSentences.length - 1), 'playing');
                setPlayerState(true);
                const s = activeStudent();
                playerTitle.innerHTML = `正在播放：<strong>${escapeHtml(s.name)}《${escapeHtml(s.title)}》</strong>`;
                if (tts.isPaused) btnPause.textContent = '▶ 繼續';
            }
        }

        function startPlay(fromIndex) {
            stopRecording(true);
            const student = activeStudent();
            tts.onSentenceChange = updateSentenceUI;
            tts.onEnd = onPlayEnd;
            tts.speak(student, activeSentences, fromIndex || 0);
            setPlayerState(true);
            const s = activeStudent();
            playerTitle.innerHTML = `正在播放：<strong>${escapeHtml(s.name)}《${escapeHtml(s.title)}》</strong>`;
        }

        function playFromSentence(index) {
            startPlay(index);
        }

        function onPlayEnd() {
            setPlayerState(false);
            playerTitle.textContent = '播放完畢';
            document.querySelectorAll('#storyWrap .sentence').forEach(el => {
                el.classList.remove('playing');
                el.classList.add('spoken');
            });
            playerProgressFill.style.width = '100%';
            playerCount.textContent = `第 ${activeSentences.length} / ${activeSentences.length} 句`;
        }

        function setPlayerState(playing) {
            btnPlay.disabled = playing;
            btnPause.disabled = !playing;
            btnStop.disabled = !playing;
            btnPause.textContent = '⏸ 暫停';
        }

        function resetPlayerUI() {
            setPlayerState(false);
            const s = activeStudent();
            playerTitle.innerHTML = `已選擇：<strong>${escapeHtml(s.name)}《${escapeHtml(s.title)}》</strong>（尚未播放）`;
            playerCount.textContent = `第 0 / ${activeSentences.length} 句`;
            playerProgressFill.style.width = '0%';
        }

        function updateSentenceUI(index, state) {
            const els = document.querySelectorAll('#storyWrap .sentence');
            els.forEach((el, i) => {
                el.classList.remove('playing', 'spoken');
                if (i < index) el.classList.add('spoken');
                else if (i === index && state === 'playing') el.classList.add('playing');
            });
            const current = els[index];
            if (current && state === 'playing') {
                current.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            const done = (state === 'spoken') ? 1 : 0;
            const total = els.length || 1;
            playerProgressFill.style.width = Math.min(((index + done) / total) * 100, 100) + '%';
            playerCount.textContent = `第 ${Math.min(index + 1, total)} / ${total} 句`;
        }

        // ---------- 錄音跟讀 ＋ 電腦評分 ----------
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        let rec = { active: false, index: -1, sid: 0, recognition: null, stream: null, mediaRecorder: null, chunks: [], finalText: '', timer: null, audioUrl: null };

        function recSupported() {
            return !!SR && !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia) && !!window.MediaRecorder;
        }

        function recBtn(index) { return document.getElementById('rec-btn-' + index); }
        function recFb(index) { return document.getElementById('rec-fb-' + index); }

        function setRecBtnIdle(index, label) {
            const b = recBtn(index);
            if (!b) return;
            b.disabled = false;
            b.classList.remove('recording');
            b.textContent = label || '錄音跟讀';
        }

        function showRecMsg(index, msg) {
            const fb = recFb(index);
            if (!fb) return;
            fb.hidden = false;
            fb.innerHTML = `<div class="rec-heard">${escapeHtml(msg)}</div>`;
        }

        function toggleRecord(index) {
            if (rec.active && rec.index === index) { finishRecording(); return; }
            startRecording(index);
        }

        async function startRecording(index) {
            if (!recSupported()) {
                showRecMsg(index, '此瀏覽器不支援錄音辨識，請改用電腦版 Chrome 或 Edge，並允許使用麥克風。');
                return;
            }
            stopRecording(true);
            tts.stop(true); // 避免範讀聲音被一起收進去
            const b = recBtn(index);
            const fb = recFb(index);
            if (rec.audioUrl) { URL.revokeObjectURL(rec.audioUrl); rec.audioUrl = null; }
            let stream;
            try {
                stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            } catch (e) {
                showRecMsg(index, '無法使用麥克風（可能被拒絕或沒有麥克風），請檢查瀏覽器權限後再試一次。');
                return;
            }
            const sid = ++rec.sid;
            rec.active = true;
            rec.index = index;
            rec.stream = stream;
            rec.chunks = [];
            rec.finalText = '';
            if (b) { b.disabled = false; b.classList.add('recording'); b.textContent = '停止錄音'; }
            if (fb) { fb.hidden = false; fb.innerHTML = `<div class="rec-heard">聆聽中… 請唸出上面的英文句子，唸完按「停止錄音」。</div>`; }
            // 同時錄音（供回放）與語音辨識（供評分）
            try {
                const mr = new MediaRecorder(stream);
                rec.mediaRecorder = mr;
                mr.ondataavailable = (e) => { if (e.data && e.data.size > 0) rec.chunks.push(e.data); };
                mr.onstop = () => {
                    if (rec.chunks.length === 0) return;
                    try {
                        if (rec.audioUrl) URL.revokeObjectURL(rec.audioUrl);
                        rec.audioUrl = URL.createObjectURL(new Blob(rec.chunks, { type: mr.mimeType || 'audio/webm' }));
                        const a = document.getElementById('rec-audio-' + index);
                        if (a) { a.src = rec.audioUrl; a.hidden = false; }
                    } catch (e) { /* 忽略回放錯誤 */ }
                };
                mr.start();
            } catch (e) { rec.mediaRecorder = null; }
            const r = new SR();
            rec.recognition = r;
            r.lang = 'en-US';
            r.interimResults = true;
            r.maxAlternatives = 1;
            r.continuous = false;
            r.onresult = (e) => {
                if (sid !== rec.sid) return;
                let interim = '';
                for (let i = e.resultIndex; i < e.results.length; i++) {
                    const tr = e.results[i][0].transcript;
                    if (e.results[i].isFinal) rec.finalText += tr + ' ';
                    else interim += tr;
                }
                const f = recFb(index);
                if (f && rec.active) {
                    const show = (rec.finalText + interim).trim();
                    f.innerHTML = `<div class="rec-heard">聆聽中…${show ? '「' + escapeHtml(show) + '」' : '請開始唸。'}</div>`;
                }
            };
            r.onerror = (e) => {
                if (sid !== rec.sid) return;
                if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
                    finalizeRecording(sid, true, '無法使用語音辨識（麥克風權限或網路問題），請確認已允許麥克風並保持連線後再試。');
                }
                // no-speech / aborted 等由 onend 統一收尾
            };
            r.onend = () => {
                if (sid !== rec.sid || !rec.active) return;
                finalizeRecording(sid, false);
            };
            try { r.start(); } catch (e) {
                finalizeRecording(sid, true, '語音辨識啟動失敗，請改用電腦版 Chrome 或 Edge 再試一次。');
                return;
            }
            rec.timer = setTimeout(() => { if (rec.active && rec.index === index) finishRecording(); }, 30000);
        }

        function finishRecording() {
            if (!rec.active) return;
            try { rec.recognition && rec.recognition.stop(); } catch (e) { /* 忽略 */ }
            // 等待 onend → finalizeRecording 收尾（含 30 秒自動停止）
        }

        function stopRecording(silent) {
            if (!rec.active) return;
            rec.sid++;
            rec.active = false;
            if (rec.timer) { clearTimeout(rec.timer); rec.timer = null; }
            const idx = rec.index;
            try { rec.recognition && rec.recognition.abort(); } catch (e) { /* 忽略 */ }
            try { rec.mediaRecorder && rec.mediaRecorder.state !== 'inactive' && rec.mediaRecorder.stop(); } catch (e) { /* 忽略 */ }
            try { rec.stream && rec.stream.getTracks().forEach(t => t.stop()); } catch (e) { /* 忽略 */ }
            rec.recognition = null; rec.mediaRecorder = null; rec.stream = null;
            setRecBtnIdle(idx);
            if (!silent) { const fb = recFb(idx); if (fb) fb.hidden = true; }
        }

        function finalizeRecording(sid, failed, failMsg) {
            if (sid !== rec.sid || !rec.active) return;
            rec.active = false;
            if (rec.timer) { clearTimeout(rec.timer); rec.timer = null; }
            const index = rec.index;
            const target = activeStudent().lines[index].en;
            const heard = (rec.finalText || '').trim();
            try { rec.mediaRecorder && rec.mediaRecorder.state !== 'inactive' && rec.mediaRecorder.stop(); } catch (e) { /* 忽略 */ }
            try { rec.stream && rec.stream.getTracks().forEach(t => t.stop()); } catch (e) { /* 忽略 */ }
            rec.recognition = null; rec.mediaRecorder = null; rec.stream = null;
            setRecBtnIdle(index, '再錄一次');
            const fb = recFb(index);
            if (!fb) return;
            fb.hidden = false;
            if (failed) {
                fb.innerHTML = `<div class="rec-heard">${escapeHtml(failMsg || '辨識失敗，請再試一次。')}</div>`;
                return;
            }
            if (!heard) {
                fb.innerHTML = `<div class="rec-score low">沒有聽到聲音</div>` +
                    `<div class="rec-heard">請靠近麥克風，大聲清楚地唸一次，再按「再錄一次」重試。也可以先按句子聽一次範讀。</div>`;
                return;
            }
            const result = scorePronunciation(target, heard);
            const cls = result.score >= 85 ? 'good' : (result.score >= 60 ? 'ok' : 'low');
            let msg;
            if (result.score === 100) msg = '完美！發音非常標準，繼續保持！';
            else if (result.score >= 85) msg = '太棒了！幾乎完全正確，紅色的字再注意一下。';
            else if (result.score >= 60) msg = '很好！先聽一次原音，再跟著慢慢唸一次，紅色的字多練習。';
            else msg = '別灰心！先按句子聽一次範讀，跟著慢慢唸，再試一次一定更好。';
            const words = target.split(/\s+/).map((w, wi) => {
                const mark = result.wordMarks[wi];
                const c = mark === true ? 'w-ok' : (mark === false ? 'w-miss' : 'w-skip');
                return `<span class="${c}">${escapeHtml(w)}</span>`;
            }).join(' ');
            fb.innerHTML =
                `<div class="rec-score ${cls}">${result.score} 分 · ${escapeHtml(msg)}</div>` +
                `<div class="rec-heard">電腦聽到你說：「${escapeHtml(heard)}」</div>` +
                `<div class="rec-words">${words}</div>` +
                `<div class="rec-actions">` +
                    `<audio id="rec-audio-${index}" controls hidden></audio>` +
                    `<button class="btn btn-secondary btn-sm" onclick="event.stopPropagation(); playFromSentence(${index})">播放原音</button>` +
                `</div>` +
                `<div class="rec-tip">綠色＝電腦有聽到，紅色＝可能沒唸清楚或漏掉。辨識僅供參考，環境太吵會影響分數。</div>`;
        }

        // 單字層級比對（LCS）：原諒大小寫與標點，don't / grandfather's 等視為一個單字
        function scorePronunciation(target, spoken) {
            const tok = (s) => {
                const parts = s.split(/\s+/);
                const tokens = [], map = [];
                parts.forEach((w, wi) => {
                    const t = w.toLowerCase().replace(/'/g, '').replace(/[^a-z0-9]/g, '');
                    if (t) { tokens.push(t); map.push(wi); }
                });
                return { tokens, map, count: parts.length };
            };
            const T = tok(target), S = tok(spoken);
            const n = T.tokens.length, m = S.tokens.length;
            const wordMarks = new Array(T.count).fill(null);
            if (n === 0) return { score: 0, wordMarks };
            if (m === 0) {
                T.map.forEach((wi) => { wordMarks[wi] = false; });
                return { score: 0, wordMarks };
            }
            const dp = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
            for (let i = n - 1; i >= 0; i--) {
                for (let j = m - 1; j >= 0; j--) {
                    dp[i][j] = T.tokens[i] === S.tokens[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
                }
            }
            const hitToken = new Array(n).fill(false);
            let i = 0, j = 0;
            while (i < n && j < m) {
                if (T.tokens[i] === S.tokens[j]) { hitToken[i] = true; i++; j++; }
                else if (dp[i + 1][j] >= dp[i][j + 1]) i++;
                else j++;
            }
            let hit = 0;
            hitToken.forEach((h, k) => {
                wordMarks[T.map[k]] = h;
                if (h) hit++;
            });
            // 從未對應到的顯示字（純標點）標為 skip
            for (let k = 0; k < wordMarks.length; k++) {
                if (wordMarks[k] === undefined || wordMarks[k] === null) wordMarks[k] = 'skip';
            }
            return { score: Math.round((hit / n) * 100), wordMarks };
        }

        // 匯出目前分頁學生的朗讀稿 PDF（經由瀏覽器列印 → 另存為 PDF）
        function exportPDF(kind) {
            const s = activeStudent();
            const items = s.lines.map(l =>
                `<li><p class="p-en">${escapeHtml(l.en)}</p>` +
                (kind === 'bi' ? `<p class="p-zh">${escapeHtml(l.zh)}</p>` : '') +
                `</li>`
            ).join('');
            const kindLabel = kind === 'bi' ? '中英對照朗讀稿' : '純英文朗讀稿';
            document.getElementById('printArea').innerHTML =
                `<div class="sheet">` +
                    `<h1>說故事比賽${kindLabel}</h1>` +
                    `<p class="meta">姓名：${escapeHtml(s.name)}（${escapeHtml(s.id)}）｜篇名：${escapeHtml(s.title)}｜共 ${s.lines.length} 句</p>` +
                    `<ol class="script">${items}</ol>` +
                    `<p class="foot">Storytelling Competition · ${escapeHtml(s.name)}《${escapeHtml(s.title)}》${kindLabel}</p>` +
                `</div>`;
            window.print();
        }

        btnPlay.onclick = () => startPlay(0);
        btnReplay.onclick = () => startPlay(0);
        btnStop.onclick = () => {
            tts.stop(true);
            document.querySelectorAll('#storyWrap .sentence').forEach(el => el.classList.remove('playing', 'spoken'));
            resetPlayerUI();
        };
        btnPause.onclick = () => {
            const paused = tts.pauseToggle();
            btnPause.textContent = paused ? '▶ 繼續' : '⏸ 暫停';
        };
        speedRange.oninput = () => {
            const v = parseFloat(speedRange.value);
            tts.setSpeed(v);
            speedVal.textContent = v.toFixed(1) + 'x';
        };

        document.addEventListener('DOMContentLoaded', () => {
            renderTabs();
            renderActiveStory();
            setTimeout(() => tts.loadVoices(), 500);
        });
    </script>
</body>
