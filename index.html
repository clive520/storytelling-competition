<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>說故事比賽 - Storytelling Competition</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            padding: 20px 20px 190px 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        header {
            text-align: center; padding: 30px 20px;
            background: white; border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); margin-bottom: 16px;
        }
        header h1 { color: #2c3e50; font-size: 2rem; font-weight: 700; margin-bottom: 8px; }
        header p { color: #7f8c8d; font-size: 1rem; }

        /* 分頁籤 */
        .tabs {
            position: sticky; top: 10px; z-index: 50;
            display: flex; gap: 8px; overflow-x: auto;
            padding: 10px; margin-bottom: 16px;
            background: rgba(255,255,255,0.95);
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08);
            backdrop-filter: blur(6px);
        }
        .tab {
            flex: 0 0 auto; padding: 10px 16px;
            border: 2px solid transparent; border-radius: 10px;
            background: #f0f2f5; color: #2c3e50;
            font-size: 0.95rem; font-weight: 600; cursor: pointer;
            transition: all 0.2s; white-space: nowrap;
        }
        .tab:hover { background: #e4e8eb; }
        .tab.active {
            background: linear-gradient(135deg, #4facfe 0%, #00c6ff 100%);
            color: white; border-color: #4facfe;
            box-shadow: 0 4px 12px rgba(79,172,254,0.4);
        }
        .tab .tab-sub { display: block; font-size: 0.75rem; font-weight: 400; opacity: 0.85; }

        .story-card {
            background: white; border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 24px;
        }
        .story-header {
            display: flex; align-items: center; gap: 16px;
            margin-bottom: 16px; padding-bottom: 14px;
            border-bottom: 2px solid #f0f2f5;
        }
        .student-avatar {
            width: 56px; height: 56px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.5rem; font-weight: 700; color: white; flex-shrink: 0;
        }
        .student-avatar.female { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .student-avatar.male { background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%); }
        .student-info h3 { font-size: 1.2rem; color: #2c3e50; font-weight: 600; }
        .student-info span { font-size: 0.85rem; color: #95a5a6; }
        .story-title { font-size: 1.3rem; font-weight: 600; color: #34495e; margin-bottom: 12px; }
        .hint { font-size: 0.85rem; color: #95a5a6; margin-bottom: 12px; }
        .story-text { line-height: 1.9; font-size: 1.08rem; color: #2c3e50; }
        .sentence {
            display: block; padding: 8px 12px; border-radius: 8px;
            transition: all 0.2s ease; cursor: pointer; margin: 4px 0;
        }
        .sentence:hover { background: #f8f9fa; }
        .sentence.playing {
            background: linear-gradient(90deg, #e8f4fd 0%, #d6eaff 100%);
            border-left: 4px solid #4facfe;
        }
        .sentence.spoken { color: #95a5a6; }

        /* 底部常駐播放列 */
        .player-bar {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 100;
            background: rgba(255,255,255,0.98);
            border-top: 1px solid #e4e8eb;
            box-shadow: 0 -6px 24px rgba(0,0,0,0.12);
            backdrop-filter: blur(8px);
        }
        .player-inner {
            max-width: 900px; margin: 0 auto; padding: 12px 16px 14px 16px;
        }
        .player-info {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.85rem; color: #5d6d7e; margin-bottom: 8px; gap: 8px;
        }
        .player-info strong { color: #2c3e50; }
        .player-progress {
            height: 8px; background: #eef1f4; border-radius: 4px;
            overflow: hidden; margin-bottom: 10px; cursor: pointer;
        }
        .player-progress-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            border-radius: 4px; transition: width 0.15s linear;
        }
        .player-controls { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .btn {
            padding: 10px 18px; border: none; border-radius: 10px;
            font-size: 0.95rem; font-weight: 600; cursor: pointer;
            transition: all 0.2s; display: flex; align-items: center; gap: 8px;
        }
        .btn-primary { background: linear-gradient(135deg, #4facfe 0%, #00c6ff 100%); color: white; }
        .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(79,172,254,0.4); }
        .btn-secondary { background: #f0f2f5; color: #2c3e50; }
        .btn-secondary:hover { background: #e4e8eb; }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; box-shadow: none; }
        .speed-control { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: #7f8c8d; margin-left: auto; }
        .speed-control input { width: 110px; accent-color: #4facfe; }

        .voice-status {
            text-align: center; padding: 12px; background: #fff3cd;
            border-radius: 10px; color: #856404; font-size: 0.9rem;
            margin-bottom: 16px; display: none;
        }
        .voice-status.show { display: block; }
        footer { text-align: center; padding: 20px; color: #95a5a6; font-size: 0.85rem; }
        @media (max-width: 600px) {
            header h1 { font-size: 1.5rem; }
            .story-card { padding: 16px; }
            .speed-control { margin-left: 0; width: 100%; }
            body { padding: 12px 12px 210px 12px; }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>說故事比賽作品集</h1>
            <p>Storytelling Competition Collection · 點分頁切換學生 · 點句子可從該句播放</p>
        </header>

        <div id="voiceStatus" class="voice-status">正在載入語音引擎... 請稍候</div>

        <nav class="tabs" id="tabs" aria-label="學生分頁"></nav>

        <div id="storyWrap"></div>

        <footer>
            <p>使用瀏覽器內建語音合成 (Web Speech API) | 適合練習聽力與跟讀</p>
        </footer>
    </div>

    <!-- 常駐播放列：永遠在畫面底部，隨時可暫停 / 重新播放 -->
    <div class="player-bar">
        <div class="player-inner">
            <div class="player-info">
                <span id="playerTitle">尚未播放</span>
                <span id="playerCount">第 0 / 0 句</span>
            </div>
            <div class="player-progress" id="playerProgress" title="播放進度">
                <div class="player-progress-fill" id="playerProgressFill"></div>
            </div>
            <div class="player-controls">
                <button class="btn btn-primary" id="btnPlay">▶ 播放全文</button>
                <button class="btn btn-secondary" id="btnPause" disabled>⏸ 暫停</button>
                <button class="btn btn-secondary" id="btnReplay">↺ 重新播放</button>
                <button class="btn btn-secondary" id="btnStop" disabled>⏹ 停止</button>
                <div class="speed-control">
                    <span>語速</span>
                    <input type="range" id="speedRange" min="0.5" max="1.5" step="0.1" value="0.7">
                    <span id="speedVal">0.7x</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const students = [
            {
                id: '60124',
                name: '何禹潼',
                gender: 'female',
                title: 'The Weight of Air',
                story: `In the City of Glass, citizens were defined by their burdens. Every adult carried a large stone. The heavier the stone, the more respect they earned. Kael carried the heaviest stone of all. It was jagged, dark, and represented his greatest regret.
Kael climbed the Mountain of Whispers to find relief.
Halfway up, a Blacksmith offered to encase the stone in iron. "Protect your burden," he said. Kael refused. "Iron makes it heavier."
Higher up, a Jeweler offered to coat it in gold. "Make your pain beautiful," she said. Kael refused. "Gold only hides the weight."
Near the summit, a Scholar offered to write a book about it. "Analyze your burden," he said. Kael refused. "Analysis does not lift it."
Kael reached the absolute peak. The wind howled. His knees buckled under the crushing weight. He didn't throw the stone. Instead, he looked directly at it, accepted his past, and whispered:
The stone instantly turned to mist, blowing away into the sky. Kael stood completely straight for the first time. He realized the heaviest burdens aren't made of rock; they are made of the regrets we refuse to let go.`
            },
            {
                id: '60120',
                name: '蔡亞璇',
                gender: 'female',
                title: 'The Boy and the Apple Tree',
                story: `Once upon a time, a little boy loved a big apple tree.
Every day, he played under the tree, climbed its branches, and ate sweet apples.
The tree loved the boy, and they were very happy.
As time went by, the boy grew up and stopped visiting.
One day, he returned looking sad. "I want toys, but I have no money," he said.
The tree smiled and said, "Take my apples and sell them in town."
The boy picked all the apples and ran away happily.
Many years passed. The boy did not return, and the tree felt very lonely.`
            },
            {
                id: '60122',
                name: '陳柏舜',
                gender: 'male',
                title: 'Leo and the Time Radio',
                story: `Leo found the radio at the back of his grandfather's dusty garage. It wasn't anything sleek or modern; it was a bulky, wooden box with a glowing amber dial and brass knobs that felt heavy and cold to the touch. He only plugged it in to see if the ancient tubes still worked. They did, humming to life with a soft, warm light, but the speaker only offered a steady wall of static.
He turned the largest knob, listening to the hiss and crackle, until suddenly, a voice cut through the noise. It wasn't a local DJ or a familiar news anchor. The voice sounded incredibly clear, speaking in a calm, almost mechanical rhythm.
"Attention citizens of Sector Four. Tomorrow's solar transit will cause minor disruptions to all aerial tram schedules. Please plan for a ten-minute delay. Also, remember to calibrate your UV-reflective gear; the atmospheric glare will be particularly intense this week."
Leo froze, his hand hovering over the dial. Aerial trams? Sector Four? He carefully twisted the knob a fraction of an inch, hoping to catch more, but the station vanished, swallowed instantly back into the white noise.
Over the next few weeks, Leo became completely absorbed by the device. He spent every afternoon in the sweltering garage, meticulously adjusting the brass dials. He quickly learned that the radio didn't tune into different geographical stations; it tuned into different eras. On a rainy Tuesday, he heard a broadcast from what sounded like a deep-sea colony, the announcer complaining about saltwater corrosion on the exterior domes. On Thursday, he caught a snippet of a music countdown featuring synthesized instruments he couldn't even imagine, played by bands broadcasting from the late 22nd century.
He tried to record the voices on his phone, desperate for proof, but whenever he played the audio back, the recordings held nothing but regular, unbroken static. The anomaly, it seemed, existed strictly between his own ears and the strange wooden box.
Eventually, Leo stopped trying to capture the audio or prove it to his friends. It became his own private window into the unknown, a quiet assurance that no matter how stressful his upcoming exams or daily teenage struggles felt, humanity was still out there in the distant future. They were still riding transit, complaining about the weather, and listening to the radio. The world was going to keep spinning, and for a teenager trying to figure out his own small place in it, that was exactly what he needed to hear.`
            },
            {
                id: '60115',
                name: '林云晴',
                gender: 'female',
                title: 'The Magic Seed',
                story: `Ben was a young boy who lived near a giant, ancient forest. Unlike his brothers, who loved building wooden swords and running wild, Ben loved watching plants grow. He spent every afternoon in his small garden, caring for his flowers.
One rainy afternoon, an old traveler stopped by Ben's house. "Thank you for the warm tea, young boy," the traveler said, reaching into his pocket. "Take this golden seed. If you care for it with patience, it will show you something magical."
Ben planted the tiny seed in a small clay pot. Every morning, he gave it clear water and placed it in the brightest sunlight. Days passed, but nothing grew. His brothers laughed and said, "It is just an empty shell, Ben! Give up!"
However, Ben did not lose hope. He remembered the traveler's words about patience. On the seventh morning, a tiny green shoot popped out of the soil. Day by day, it grew taller, until a glowing, silver flower bloomed!
The flower filled the air with a sweet scent and brought colorful butterflies from all over the forest. Ben's brothers watched in complete wonder.
Ben smiled and said, "Great things take time to grow. All we need is a little patience."`
            },
            {
                id: '60126',
                name: '吳丹楓',
                gender: 'female',
                title: 'The Bowl of Soup',
                story: `One evening, Xiao-An went to her Japanese friend's house for dinner. It was her first time having dinner with a Japanese family, so she was very excited and curious about their culture.
When she arrived, her friend's grandmother welcomed her warmly. The dining table was filled with delicious food. Before dinner began, Xiao-An noticed a bowl of hot soup on a small table near the window. It smelled wonderful, and she thought it was prepared for the guests.
Without thinking, she picked it up and took a sip.
"Wow! This soup is delicious. Thank you!" she said.
Her friend suddenly looked surprised.
"You drank that soup?"
Xiao-An looked confused. "Yes. Isn't it for us?"
Her friend explained, "Actually, no. It is an offering for our ancestors. We place food there to remember our family members who have passed away."
Xiao-An immediately put down the bowl.
"Oh, I'm really sorry. I didn't know."
She felt embarrassed, but her friend's grandmother simply smiled.
"Don't worry," she said. "You didn't know our customs. Every culture has different traditions."
She then made a new bowl of soup for Xiao-An.
"This one is for you."
Xiao-An felt grateful and thanked her.
During dinner, the two girls talked about their families. Xiao-An discovered that her own family also prepares food for their ancestors during special holidays.
She realized that something ordinary in one culture can have a completely different meaning in another. Instead of thinking that something is strange, we should learn about it and respect it.
Although their traditions were different, both families shared the same love for their ancestors.
Xiao-An smiled and thought, "Maybe different cultures are not so different after all."
Different traditions can teach us about each other, and understanding can bring people closer together.`
            }
        ];

        function splitSentences(text) {
            return text.split(/(?<=[.!?])\s+(?=[A-Z"])|\n\s*\n/).filter(s => s.trim().length > 0);
        }
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        class TTSManager {
            constructor() {
                this.synth = window.speechSynthesis;
                this.voices = [];
                this.currentUtterance = null;
                this.currentStudent = null;
                this.currentSentenceIndex = 0;
                this.sentences = [];
                this.isPlaying = false;
                this.isPaused = false;
                this.speed = 0.7;
                this.onSentenceChange = null;
                this.onEnd = null;
                this.loadVoices();
            }
            loadVoices() {
                this.voices = this.synth.getVoices();
                if (this.voices.length === 0) {
                    this.synth.onvoiceschanged = () => this.loadVoices();
                }
                this.updateVoiceStatus();
            }
            updateVoiceStatus() {
                const statusEl = document.getElementById('voiceStatus');
                if (this.voices.length === 0) {
                    statusEl.textContent = '語音引擎載入中... 請稍候';
                    statusEl.classList.add('show');
                } else {
                    statusEl.classList.remove('show');
                }
            }
            getVoice(gender) {
                const prefs = gender === 'female'
                    ? ['Microsoft Zira', 'Microsoft Huihui', 'Google US English Female', 'Google UK English Female', 'Samantha', 'Karen', 'Veena']
                    : ['Microsoft David', 'Microsoft Kangkang', 'Google US English Male', 'Google UK English Male', 'Alex', 'Daniel', 'Ravi'];
                for (const pref of prefs) {
                    const voice = this.voices.find(v => v.name.includes(pref));
                    if (voice) return voice;
                }
                const keyword = gender === 'female' ? 'female' : 'male';
                const voice = this.voices.find(v => v.name.toLowerCase().includes(keyword));
                if (voice) return voice;
                return this.voices[0] || null;
            }
            speak(student, sentences, startIndex = 0) {
                this.stop(true);
                this.currentStudent = student;
                this.sentences = sentences;
                this.currentSentenceIndex = startIndex;
                this.isPlaying = true;
                this.isPaused = false;
                this.speakNext();
            }
            speakNext() {
                if (this.currentSentenceIndex >= this.sentences.length) {
                    const cb = this.onEnd;
                    this.isPlaying = false;
                    this.isPaused = false;
                    if (cb) cb();
                    return;
                }
                const sentence = this.sentences[this.currentSentenceIndex].trim();
                if (!sentence) {
                    this.currentSentenceIndex++;
                    this.speakNext();
                    return;
                }
                this.currentUtterance = new SpeechSynthesisUtterance(sentence);
                this.currentUtterance.lang = 'en-US';
                this.currentUtterance.rate = this.speed;
                this.currentUtterance.pitch = 1;
                this.currentUtterance.volume = 1;
                const voice = this.getVoice(this.currentStudent.gender);
                if (voice) this.currentUtterance.voice = voice;
                this.currentUtterance.onstart = () => {
                    if (this.onSentenceChange) this.onSentenceChange(this.currentSentenceIndex, 'playing');
                };
                this.currentUtterance.onend = () => {
                    if (this.onSentenceChange) this.onSentenceChange(this.currentSentenceIndex, 'spoken');
                    this.currentSentenceIndex++;
                    if (this.isPlaying && !this.isPaused) this.speakNext();
                };
                this.currentUtterance.onerror = () => {
                    this.currentSentenceIndex++;
                    if (this.isPlaying) this.speakNext();
                };
                this.synth.speak(this.currentUtterance);
            }
            pauseToggle() {
                if (!this.isPlaying) return false;
                if (this.isPaused) {
                    this.synth.resume();
                    this.isPaused = false;
                } else {
                    this.synth.pause();
                    this.isPaused = true;
                }
                return this.isPaused;
            }
            stop(silent) {
                this.synth.cancel();
                this.isPlaying = false;
                this.isPaused = false;
                this.currentUtterance = null;
                if (!silent && this.onSentenceChange) this.onSentenceChange(this.currentSentenceIndex, 'reset');
            }
            setSpeed(speed) {
                this.speed = speed;
            }
        }

        const tts = new TTSManager();
        let activeStudentId = students[0].id;
        let activeSentences = [];

        const tabsEl = document.getElementById('tabs');
        const storyWrap = document.getElementById('storyWrap');
        const btnPlay = document.getElementById('btnPlay');
        const btnPause = document.getElementById('btnPause');
        const btnReplay = document.getElementById('btnReplay');
        const btnStop = document.getElementById('btnStop');
        const playerTitle = document.getElementById('playerTitle');
        const playerCount = document.getElementById('playerCount');
        const playerProgressFill = document.getElementById('playerProgressFill');
        const speedRange = document.getElementById('speedRange');
        const speedVal = document.getElementById('speedVal');

        function activeStudent() {
            return students.find(s => s.id === activeStudentId);
        }

        function renderTabs() {
            tabsEl.innerHTML = students.map(s =>
                `<button class="tab ${s.id === activeStudentId ? 'active' : ''}" onclick="switchTab('${s.id}')">` +
                `${escapeHtml(s.name)}<span class="tab-sub">${escapeHtml(s.title)}</span></button>`
            ).join('');
        }

        function renderActiveStory() {
            const student = activeStudent();
            activeSentences = splitSentences(student.story);
            const sentenceHtml = activeSentences.map((s, i) =>
                `<span class="sentence" data-index="${i}" onclick="playFromSentence(${i})">${escapeHtml(s)}</span>`
            ).join(' ');
            storyWrap.innerHTML =
                `<article class="story-card" id="story-${student.id}">` +
                    `<div class="story-header">` +
                        `<div class="student-avatar ${student.gender}">${escapeHtml(student.name.charAt(0))}</div>` +
                        `<div class="student-info"><h3>${escapeHtml(student.name)} (${escapeHtml(student.id)})</h3>` +
                        `<span>${student.gender === 'female' ? '女生 · 女聲' : '男生 · 男聲'} · 共 ${activeSentences.length} 句</span></div>` +
                    `</div>` +
                    `<h2 class="story-title">${escapeHtml(student.title)}</h2>` +
                    `<p class="hint">提示：點任一句可從該句開始朗讀；播放中會自動捲到目前句子。</p>` +
                    `<div class="story-text">${sentenceHtml}</div>` +
                `</article>`;
            resetPlayerUI();
        }

        function switchTab(studentId) {
            if (studentId === activeStudentId && activeSentences.length > 0) return;
            tts.stop(true);
            activeStudentId = studentId;
            renderTabs();
            renderActiveStory();
        }

        function startPlay(fromIndex) {
            const student = activeStudent();
            tts.onSentenceChange = updateSentenceUI;
            tts.onEnd = onPlayEnd;
            tts.speak(student, activeSentences, fromIndex || 0);
            setPlayerState(true);
            const s = activeStudent();
            playerTitle.innerHTML = `正在播放：<strong>${escapeHtml(s.name)}《${escapeHtml(s.title)}》</strong>`;
        }

        function playFromSentence(index) {
            startPlay(index);
        }

        function onPlayEnd() {
            setPlayerState(false);
            playerTitle.textContent = '播放完畢';
            document.querySelectorAll('#storyWrap .sentence').forEach(el => {
                el.classList.remove('playing');
                el.classList.add('spoken');
            });
            playerProgressFill.style.width = '100%';
            playerCount.textContent = `第 ${activeSentences.length} / ${activeSentences.length} 句`;
        }

        function setPlayerState(playing) {
            btnPlay.disabled = playing;
            btnPause.disabled = !playing;
            btnStop.disabled = !playing;
            btnPause.textContent = '⏸ 暫停';
        }

        function resetPlayerUI() {
            setPlayerState(false);
            const s = activeStudent();
            playerTitle.innerHTML = `已選擇：<strong>${escapeHtml(s.name)}《${escapeHtml(s.title)}》</strong>（尚未播放）`;
            playerCount.textContent = `第 0 / ${activeSentences.length} 句`;
            playerProgressFill.style.width = '0%';
        }

        function updateSentenceUI(index, state) {
            const els = document.querySelectorAll('#storyWrap .sentence');
            els.forEach((el, i) => {
                el.classList.remove('playing', 'spoken');
                if (i < index) el.classList.add('spoken');
                else if (i === index && state === 'playing') el.classList.add('playing');
            });
            const current = els[index];
            if (current && state === 'playing') {
                current.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
            const done = (state === 'spoken') ? 1 : 0;
            const total = els.length || 1;
            playerProgressFill.style.width = Math.min(((index + done) / total) * 100, 100) + '%';
            playerCount.textContent = `第 ${Math.min(index + 1, total)} / ${total} 句`;
        }

        btnPlay.onclick = () => startPlay(0);
        btnReplay.onclick = () => startPlay(0);
        btnStop.onclick = () => {
            tts.stop(true);
            document.querySelectorAll('#storyWrap .sentence').forEach(el => el.classList.remove('playing', 'spoken'));
            resetPlayerUI();
        };
        btnPause.onclick = () => {
            const paused = tts.pauseToggle();
            btnPause.textContent = paused ? '▶ 繼續' : '⏸ 暫停';
        };
        speedRange.oninput = () => {
            const v = parseFloat(speedRange.value);
            tts.setSpeed(v);
            speedVal.textContent = v.toFixed(1) + 'x';
        };

        document.addEventListener('DOMContentLoaded', () => {
            renderTabs();
            renderActiveStory();
            setTimeout(() => tts.loadVoices(), 500);
        });
    </script>
</body>
</html>
